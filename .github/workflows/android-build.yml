name: Build Game

on:
  push:
    branches: [main, develop, "agent/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to draft a release for, e.g. v2.0.02"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_enabled: ${{ steps.release.outputs.release_enabled }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_enabled=false
          release_tag=""

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            release_enabled=true
            release_tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            release_enabled=true
            release_tag="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]]; then
            release_enabled=true
            release_tag="draft-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          fi

          echo "Resolved release_enabled=$release_enabled"
          echo "Resolved release_tag=$release_tag"
          echo "release_enabled=$release_enabled" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.release.outputs.release_enabled == 'true' && steps.release.outputs.release_tag != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.release.outputs.release_tag }}
          tag_name: ${{ steps.release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          overwrite_files: true

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            windows_arch: x64
          - os: windows-latest
            triplet: x64-windows
            windows_arch: x64
          - os: windows-latest
            triplet: x86-windows
            windows_arch: x86

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build autoconf autoconf-archive automake libtool libltdl-dev pkg-config zip unzip

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          choco install innosetup -y --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.windows_arch }}

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: .ci/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            .ci/vcpkg/downloads
            .ci/vcpkg/buildtrees
            .ci/vcpkg/packages
            .ci/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/android-build.yml') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot
          if ($env:RUNNER_OS -eq "Windows") {
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          } else {
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.sh") -disableMetrics
          }

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot
          $vcpkgExe = if ($env:RUNNER_OS -eq "Windows") { Join-Path $vcpkgRoot "vcpkg.exe" } else { Join-Path $vcpkgRoot "vcpkg" }
          if ($env:RUNNER_OS -eq "Windows") {
            $localMixerPrefix = Join-Path $env:GITHUB_WORKSPACE "deps/windows-sdl3-mixer/SDL3_mixer-3.1.2"
            if (-not (Test-Path (Join-Path $localMixerPrefix "cmake/SDL3_mixerConfig.cmake"))) {
              throw "Bundled SDL3_mixer package is missing from deps/windows-sdl3-mixer."
            }
            $env:SDL3_mixer_DIR = Join-Path $localMixerPrefix "cmake"
            $env:CMAKE_PREFIX_PATH = if ($env:CMAKE_PREFIX_PATH) { "$localMixerPrefix;$env:CMAKE_PREFIX_PATH" } else { $localMixerPrefix }
            & $vcpkgExe install sdl3 sdl3-image sdl3-ttf curl nlohmann-json --triplet "${{ matrix.triplet }}" --vcpkg-root $vcpkgRoot
          } else {
            & $vcpkgExe install sdl3 sdl3-image sdl3-ttf sdl3-mixer curl nlohmann-json --triplet "${{ matrix.triplet }}" --vcpkg-root $vcpkgRoot
          }

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot
          if ($env:RUNNER_OS -eq "Windows") {
            $localMixerPrefix = Join-Path $env:GITHUB_WORKSPACE "deps/windows-sdl3-mixer/SDL3_mixer-3.1.2"
            $env:SDL3_mixer_DIR = Join-Path $localMixerPrefix "cmake"
            $env:CMAKE_PREFIX_PATH = if ($env:CMAKE_PREFIX_PATH) { "$localMixerPrefix;$env:CMAKE_PREFIX_PATH" } else { $localMixerPrefix }
          }
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DPLATFORMER_REQUIRE_SDL3_MIXER=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-ci --config Release --parallel
          if ($env:RUNNER_OS -eq "Windows") {
            cmake --build build-ci --config Release --target windows-installer --parallel
          }

      - name: Install LLVM BOLT tools
        if: runner.os == 'Linux' && hashFiles('build/profiles/desktop-bolt/*.fdata', 'build/profiles/desktop-bolt/*/*.fdata') != ''
        env:
          LLVM_BOLT_VERSION: "22.1.8"
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_BOLT_VERSION}/LLVM-${LLVM_BOLT_VERSION}-Linux-X64.tar.xz" \
            -o "$RUNNER_TEMP/llvm-bolt.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-bolt"
          tar -xJf "$RUNNER_TEMP/llvm-bolt.tar.xz" -C "$RUNNER_TEMP/llvm-bolt" --strip-components=1
          echo "$RUNNER_TEMP/llvm-bolt/bin" >> "$GITHUB_PATH"

      - name: Optimize desktop binary layout
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            bash ./build/optimize-desktop-binary-layout.sh
          } else {
            Write-Host "[INFO] Skipping binary layout rewrite on Windows: llvm-bolt targets ELF binaries, not PE/COFF executables."
          }

      - name: Package desktop release
        if: needs.prepare_release.outputs.release_enabled == 'true'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE ("release-" + "${{ matrix.triplet }}")
          $archiveRoot = Join-Path $env:GITHUB_WORKSPACE "release"
          $assetName = if ($env:RUNNER_OS -eq "Windows") {
            "platformer-${{ matrix.triplet }}-installer.exe"
          } else {
            "platformer-${{ matrix.triplet }}.zip"
          }
          $assetPath = Join-Path $archiveRoot $assetName
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg/installed/${{ matrix.triplet }}/bin"
          $bundledMixerBin = ""
          $bundledMixerOptional = ""

          if ($env:RUNNER_OS -eq "Windows") {
            $windowsMixerRoot = Join-Path $env:GITHUB_WORKSPACE "deps/windows-sdl3-mixer/SDL3_mixer-3.1.2/lib"
            $windowsMixerArch = switch -Regex ("${{ matrix.triplet }}") {
              "^x64-" { "x64"; break }
              "^x86-" { "x86"; break }
              "^arm64-" { "arm64"; break }
              default { "" }
            }
            if (-not $windowsMixerArch) {
              throw "Unsupported Windows triplet for bundled SDL3_mixer: ${{ matrix.triplet }}"
            }
            $bundledMixerBin = Join-Path $windowsMixerRoot $windowsMixerArch
            $bundledMixerOptional = Join-Path $bundledMixerBin "optional"
          }

          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          if (Test-Path $assetPath) { Remove-Item $assetPath -Force }
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null

          if ($env:RUNNER_OS -eq "Windows") {
            $installerOutput = Join-Path $env:GITHUB_WORKSPACE "dist/windows-installer/output/df-platformer-windows-installer.exe"
            if (-not (Test-Path $installerOutput)) {
              throw "Windows installer was not produced at $installerOutput"
            }
            Copy-Item $installerOutput -Destination $assetPath -Force
          } else {
            Copy-Item "assets" -Destination (Join-Path $packageRoot "assets") -Recurse -Force
            Copy-Item "README.md" -Destination $packageRoot -Force
            Copy-Item "LICENSE" -Destination $packageRoot -Force
            Copy-Item "build-ci/platformer" -Destination $packageRoot -Force
            if (Test-Path "build-ci/sheet_config") {
              Copy-Item "build-ci/sheet_config" -Destination $packageRoot -Force
            }
            Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $assetPath -Force
          }

      - name: Upload desktop release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare_release.outputs.release_tag }}
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    needs: prepare_release

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config git unzip zip nlohmann-json3-dev

      - name: Make build scripts executable
        run: |
          chmod +x build/*.sh
          chmod +x Android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Build native Android game library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
          ANDROID_ALLOW_NO_CURL: "1"
          FORCE_REBUILD_SDL: "1"
          SDL_REF: release-3.4.x
          SDL_IMAGE_REF: release-3.4.x
          SDL_TTF_REF: release-3.4.x
          SDL_MIXER_REF: release-3.2.x
          SDL_REQUIRED_VERSION: 3.4.0
          STRIP_ANDROID_SO: "0"
          TERM: xterm
        run: |
          ./build/android-prod.sh

      - name: Install LLVM BOLT tools
        if: hashFiles('build/profiles/android-bolt/*.fdata', 'build/profiles/android-bolt/*/*.fdata', 'build/profiles/android-bolt/*/libplatformer.fdata') != ''
        env:
          LLVM_BOLT_VERSION: "22.1.8"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ndk_bolt_bin="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-bolt"
          if [[ -x "$ndk_bolt_bin" ]]; then
            echo "[info] Using llvm-bolt from the Android NDK toolchain."
            echo "$(dirname "$ndk_bolt_bin")" >> "$GITHUB_PATH"
            exit 0
          fi

          echo "[info] Android NDK did not provide llvm-bolt; downloading upstream LLVM ${LLVM_BOLT_VERSION}."
          curl -L --retry 3 --fail \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_BOLT_VERSION}/LLVM-${LLVM_BOLT_VERSION}-Linux-X64.tar.xz" \
            -o "$RUNNER_TEMP/llvm-bolt.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-bolt"
          tar -xJf "$RUNNER_TEMP/llvm-bolt.tar.xz" -C "$RUNNER_TEMP/llvm-bolt" --strip-components=1
          echo "$RUNNER_TEMP/llvm-bolt/bin" >> "$GITHUB_PATH"

      - name: Optimize Android native library layout
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
          ANDROID_BOLT_PROFILE_DIR: build/profiles/android-bolt
        run: |
          ./build/optimize-android-binary-layout.sh

      - name: Sync native library and assets
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
          ANDROID_ALLOW_NO_CURL: "1"
        run: |
          ./build/update-android-app.sh

      - name: Prepare Android release signing
        if: needs.prepare_release.outputs.release_enabled == 'true'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" && -n "${ANDROID_RELEASE_STORE_PASSWORD:-}" && -n "${ANDROID_RELEASE_KEY_ALIAS:-}" && -n "${ANDROID_RELEASE_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > Android/release-keystore.jks
            {
              echo "storeFile=release-keystore.jks"
              echo "storePassword=${ANDROID_RELEASE_STORE_PASSWORD}"
              echo "keyAlias=${ANDROID_RELEASE_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_RELEASE_KEY_PASSWORD}"
            } > Android/signing.properties
            echo "[info] Android release signing configured from GitHub secrets."
          else
            if [[ ! -f Android/release-keystore.jks || ! -f Android/signing.properties ]]; then
              echo "[error] Android release signing files are missing from the project."
              echo "[hint] Add Android/release-keystore.jks and Android/signing.properties, or configure the Android release signing secrets."
              exit 1
            fi
            echo "[info] Android release signing configured from project keystore files."
          fi

      - name: Build APKs
        working-directory: Android
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Upload Android release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare_release.outputs.release_tag }}
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: Android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS Device App
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    needs: prepare_release
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.benno111.dorfplatformertimetravel' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'development' }}
      IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: .ci/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            .ci/vcpkg/downloads
            .ci/vcpkg/buildtrees
            .ci/vcpkg/packages
            .ci/vcpkg/installed
          key: vcpkg-ios-arm64-device-${{ hashFiles('CMakeLists.txt', '.github/workflows/android-build.yml', 'cmake/vcpkg-triplets/arm64-ios-device-release.cmake') }}

      - name: Bootstrap vcpkg
        run: ./.ci/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install iOS dependencies
        run: |
          ./.ci/vcpkg/vcpkg install \
            sdl3 \
            sdl3-image \
            sdl3-ttf \
            nlohmann-json \
            --triplet arm64-ios-device-release \
            --overlay-triplets "${GITHUB_WORKSPACE}/cmake/vcpkg-triplets"

      - name: Resolve iOS signing mode
        id: ios-signing
        run: |
          set -euo pipefail

          signing_enabled=false
          if [[ -n "${IOS_BUILD_CERTIFICATE_BASE64:-}" && \
                -n "${IOS_P12_PASSWORD:-}" && \
                -n "${IOS_BUILD_PROVISION_PROFILE_BASE64:-}" && \
                -n "${IOS_KEYCHAIN_PASSWORD:-}" && \
                -n "${IOS_DEVELOPMENT_TEAM:-}" && \
                -n "${IOS_PROVISIONING_PROFILE_SPECIFIER:-}" ]]; then
            signing_enabled=true
          fi

          echo "signing_enabled=$signing_enabled" >> "$GITHUB_OUTPUT"
          echo "[info] iOS signing enabled: $signing_enabled"

      - name: Install Apple signing assets
        if: steps.ios-signing.outputs.signing_enabled == 'true'
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$IOS_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      - name: Configure iOS device build
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.ci/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios-device-release \
            -DVCPKG_OVERLAY_TRIPLETS="${GITHUB_WORKSPACE}/cmake/vcpkg-triplets" \
            -DPLATFORMER_REQUIRE_SDL3_MIXER=OFF \
            -DPLATFORMER_ENABLE_IPO=OFF \
            -DPLATFORMER_IOS_BUNDLE_ID="${IOS_BUNDLE_ID}"

      - name: Archive iOS device app
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/platformer-ios.xcarchive"
          derived_data_path="$RUNNER_TEMP/platformer-ios-derived"
          xcode_args=(
            -project build-ios/platformer.xcodeproj
            -scheme platformer
            -configuration Release
            -sdk iphoneos
            -destination generic/platform=iOS
            -derivedDataPath "$derived_data_path"
            -archivePath "$archive_path"
            COMPILER_INDEX_STORE_ENABLE=NO
            archive
          )

          if [[ "${{ steps.ios-signing.outputs.signing_enabled }}" == "true" ]]; then
            xcode_args+=(
              DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM"
              CODE_SIGN_STYLE=Manual
              PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_SPECIFIER"
            )
            if [[ -n "${IOS_CODE_SIGN_IDENTITY:-}" ]]; then
              xcode_args+=(CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY")
            fi
          else
            xcode_args+=(
              CODE_SIGNING_ALLOWED=NO
              CODE_SIGNING_REQUIRED=NO
              CODE_SIGN_IDENTITY=
            )
          fi

          xcodebuild "${xcode_args[@]}"

      - name: Export signed iOS IPA
        if: steps.ios-signing.outputs.signing_enabled == 'true' && needs.prepare_release.outputs.release_enabled == 'true'
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/platformer-ios.xcarchive"
          export_path="$RUNNER_TEMP/platformer-ios-export"
          export_options="$RUNNER_TEMP/platformer-ios-exportOptions.plist"

          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

      - name: Package iOS release bundle
        if: needs.prepare_release.outputs.release_enabled == 'true'
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/platformer-ios.xcarchive"
          derived_data_path="$RUNNER_TEMP/platformer-ios-derived"
          app_bundle="$archive_path/Products/Applications/platformer.app"
          export_ipa_path="$RUNNER_TEMP/platformer-ios-export/platformer.ipa"

          if [[ ! -d "${app_bundle}" ]]; then
            app_bundle="$derived_data_path/Build/Intermediates.noindex/ArchiveIntermediates/platformer/IntermediateBuildFilesPath/UninstalledProducts/iphoneos/platformer.app"
          fi

          if [[ ! -d "${app_bundle}" ]]; then
            app_bundle="$(find "$derived_data_path" "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'platformer.app' | head -n 1)"
          fi

          if [[ -z "${app_bundle:-}" || ! -d "${app_bundle}" ]]; then
            echo "[error] Could not locate platformer.app in $archive_path"
            if [[ -d "$archive_path" ]]; then
              find "$archive_path" -maxdepth 4 -print
            fi
            exit 1
          fi

          if [[ ! -d "${app_bundle}/assets" ]]; then
            echo "[error] iOS app bundle is missing assets at ${app_bundle}/assets"
            find "${app_bundle}" -maxdepth 2 -print
            exit 1
          fi

          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "${app_bundle}" "release/platformer-ios-device-app.zip"
          ditto -c -k --sequesterRsrc --keepParent "${archive_path}" "release/platformer-ios-device-xcarchive.zip"

          if [[ -f "${export_ipa_path}" ]]; then
            cp "${export_ipa_path}" "release/platformer-ios-device-signed.ipa"
          fi

          ipa_root="$RUNNER_TEMP/platformer-ios-ipa"
          payload_dir="$ipa_root/Payload"
          rm -rf "$ipa_root"
          mkdir -p "$payload_dir"
          ditto "${app_bundle}" "$payload_dir/platformer.app"
          (
            cd "$ipa_root"
            ditto -c -k --sequesterRsrc --keepParent "Payload" "$GITHUB_WORKSPACE/release/platformer-ios-device-sidestore.ipa"
          )

      - name: Upload iOS release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare_release.outputs.release_tag }}
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/platformer-ios-device-*

      - name: Clean up iOS signing assets
        if: ${{ always() && steps.ios-signing.outputs.signing_enabled == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
