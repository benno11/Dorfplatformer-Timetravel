name: Build Game

on:
  push:
    branches: [main, develop, "agent/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to draft a release for, e.g. v2.0.02"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_enabled: ${{ steps.release.outputs.release_enabled }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_enabled=false
          release_tag=""

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            release_enabled=true
            release_tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            release_enabled=true
            release_tag="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]]; then
            release_enabled=true
            release_tag="draft-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          fi

          echo "Resolved release_enabled=$release_enabled"
          echo "Resolved release_tag=$release_tag"
          echo "release_enabled=$release_enabled" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.release.outputs.release_enabled == 'true' && steps.release.outputs.release_tag != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.release.outputs.release_tag }}
          tag_name: ${{ steps.release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          overwrite_files: true

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            windows_arch: x64
          - os: windows-latest
            triplet: x64-windows
            windows_arch: x64
          - os: windows-latest
            triplet: x86-windows
            windows_arch: x86

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build autoconf autoconf-archive automake libtool libltdl-dev pkg-config zip unzip

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          choco install innosetup -y --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.windows_arch }}

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: .ci/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            .ci/vcpkg/downloads
            .ci/vcpkg/buildtrees
            .ci/vcpkg/packages
            .ci/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/android-build.yml') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot
          if ($env:RUNNER_OS -eq "Windows") {
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          } else {
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.sh") -disableMetrics
          }

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot
          $vcpkgExe = if ($env:RUNNER_OS -eq "Windows") { Join-Path $vcpkgRoot "vcpkg.exe" } else { Join-Path $vcpkgRoot "vcpkg" }
          if ($env:RUNNER_OS -eq "Windows") {
            $localMixerPrefix = Join-Path $env:GITHUB_WORKSPACE "deps/windows-sdl3-mixer/SDL3_mixer-3.1.2"
            if (-not (Test-Path (Join-Path $localMixerPrefix "cmake/SDL3_mixerConfig.cmake"))) {
              throw "Bundled SDL3_mixer package is missing from deps/windows-sdl3-mixer."
            }
            $env:SDL3_mixer_DIR = Join-Path $localMixerPrefix "cmake"
            $env:CMAKE_PREFIX_PATH = if ($env:CMAKE_PREFIX_PATH) { "$localMixerPrefix;$env:CMAKE_PREFIX_PATH" } else { $localMixerPrefix }
            & $vcpkgExe install sdl3 sdl3-image sdl3-ttf curl nlohmann-json --triplet "${{ matrix.triplet }}" --vcpkg-root $vcpkgRoot
          } else {
            & $vcpkgExe install sdl3 sdl3-image sdl3-ttf sdl3-mixer curl nlohmann-json --triplet "${{ matrix.triplet }}" --vcpkg-root $vcpkgRoot
          }

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot
          if ($env:RUNNER_OS -eq "Windows") {
            $localMixerPrefix = Join-Path $env:GITHUB_WORKSPACE "deps/windows-sdl3-mixer/SDL3_mixer-3.1.2"
            $env:SDL3_mixer_DIR = Join-Path $localMixerPrefix "cmake"
            $env:CMAKE_PREFIX_PATH = if ($env:CMAKE_PREFIX_PATH) { "$localMixerPrefix;$env:CMAKE_PREFIX_PATH" } else { $localMixerPrefix }
          }
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DPLATFORMER_REQUIRE_SDL3_MIXER=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-ci --config Release --parallel
          if ($env:RUNNER_OS -eq "Windows") {
            cmake --build build-ci --config Release --target windows-installer --parallel
          }

      - name: Install LLVM BOLT tools
        if: runner.os == 'Linux' && hashFiles('build/profiles/desktop-bolt/*.fdata', 'build/profiles/desktop-bolt/*/*.fdata') != ''
        env:
          LLVM_BOLT_VERSION: "22.1.8"
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_BOLT_VERSION}/LLVM-${LLVM_BOLT_VERSION}-Linux-X64.tar.xz" \
            -o "$RUNNER_TEMP/llvm-bolt.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-bolt"
          tar -xJf "$RUNNER_TEMP/llvm-bolt.tar.xz" -C "$RUNNER_TEMP/llvm-bolt" --strip-components=1
          echo "$RUNNER_TEMP/llvm-bolt/bin" >> "$GITHUB_PATH"

      - name: Optimize desktop binary layout
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            bash ./build/optimize-desktop-binary-layout.sh
          } else {
            Write-Host "[INFO] Skipping binary layout rewrite on Windows: llvm-bolt targets ELF binaries, not PE/COFF executables."
          }

      - name: Package desktop release
        if: needs.prepare_release.outputs.release_enabled == 'true'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE ("release-" + "${{ matrix.triplet }}")
          $archiveRoot = Join-Path $env:GITHUB_WORKSPACE "release"
          $assetName = if ($env:RUNNER_OS -eq "Windows") {
            "platformer-${{ matrix.triplet }}-installer.exe"
          } else {
            "platformer-${{ matrix.triplet }}.zip"
          }
          $assetPath = Join-Path $archiveRoot $assetName
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE ".ci/vcpkg/installed/${{ matrix.triplet }}/bin"
          $bundledMixerBin = ""
          $bundledMixerOptional = ""

          if ($env:RUNNER_OS -eq "Windows") {
            $windowsMixerRoot = Join-Path $env:GITHUB_WORKSPACE "deps/windows-sdl3-mixer/SDL3_mixer-3.1.2/lib"
            $windowsMixerArch = switch -Regex ("${{ matrix.triplet }}") {
              "^x64-" { "x64"; break }
              "^x86-" { "x86"; break }
              "^arm64-" { "arm64"; break }
              default { "" }
            }
            if (-not $windowsMixerArch) {
              throw "Unsupported Windows triplet for bundled SDL3_mixer: ${{ matrix.triplet }}"
            }
            $bundledMixerBin = Join-Path $windowsMixerRoot $windowsMixerArch
            $bundledMixerOptional = Join-Path $bundledMixerBin "optional"
          }

          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          if (Test-Path $assetPath) { Remove-Item $assetPath -Force }
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null

          if ($env:RUNNER_OS -eq "Windows") {
            $installerOutput = Join-Path $env:GITHUB_WORKSPACE "dist/windows-installer/output/df-platformer-windows-installer.exe"
            if (-not (Test-Path $installerOutput)) {
              throw "Windows installer was not produced at $installerOutput"
            }
            Copy-Item $installerOutput -Destination $assetPath -Force
          } else {
            Copy-Item "assets" -Destination (Join-Path $packageRoot "assets") -Recurse -Force
            Copy-Item "README.md" -Destination $packageRoot -Force
            Copy-Item "LICENSE" -Destination $packageRoot -Force
            Copy-Item "build-ci/platformer" -Destination $packageRoot -Force
            Copy-Item "build/Linux-Start.sh" -Destination $packageRoot -Force
            if (Test-Path "build-ci/sheet_config") {
              Copy-Item "build-ci/sheet_config" -Destination $packageRoot -Force
            }
            Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $assetPath -Force
          }

      - name: Upload desktop release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare_release.outputs.release_tag }}
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    needs: prepare_release

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config git unzip zip nlohmann-json3-dev

      - name: Make build scripts executable
        run: |
          chmod +x build/*.sh
          chmod +x Android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Build native Android game library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
          ANDROID_ALLOW_NO_CURL: "1"
          FORCE_REBUILD_SDL: "1"
          SDL_REF: release-3.4.x
          SDL_IMAGE_REF: release-3.4.x
          SDL_TTF_REF: release-3.4.x
          SDL_MIXER_REF: release-3.2.x
          SDL_REQUIRED_VERSION: 3.4.0
          STRIP_ANDROID_SO: "0"
          TERM: xterm
        run: |
          ./build/android-prod.sh

      - name: Install LLVM BOLT tools
        if: hashFiles('build/profiles/android-bolt/*.fdata', 'build/profiles/android-bolt/*/*.fdata', 'build/profiles/android-bolt/*/libplatformer.fdata') != ''
        env:
          LLVM_BOLT_VERSION: "22.1.8"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ndk_bolt_bin="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-bolt"
          if [[ -x "$ndk_bolt_bin" ]]; then
            echo "[info] Using llvm-bolt from the Android NDK toolchain."
            echo "$(dirname "$ndk_bolt_bin")" >> "$GITHUB_PATH"
            exit 0
          fi

          echo "[info] Android NDK did not provide llvm-bolt; downloading upstream LLVM ${LLVM_BOLT_VERSION}."
          curl -L --retry 3 --fail \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_BOLT_VERSION}/LLVM-${LLVM_BOLT_VERSION}-Linux-X64.tar.xz" \
            -o "$RUNNER_TEMP/llvm-bolt.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-bolt"
          tar -xJf "$RUNNER_TEMP/llvm-bolt.tar.xz" -C "$RUNNER_TEMP/llvm-bolt" --strip-components=1
          echo "$RUNNER_TEMP/llvm-bolt/bin" >> "$GITHUB_PATH"

      - name: Optimize Android native library layout
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
          ANDROID_BOLT_PROFILE_DIR: build/profiles/android-bolt
        run: |
          ./build/optimize-android-binary-layout.sh

      - name: Sync native library and assets
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
          ANDROID_ALLOW_NO_CURL: "1"
        run: |
          ./build/update-android-app.sh

      - name: Prepare Android release signing
        if: needs.prepare_release.outputs.release_enabled == 'true'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" && -n "${ANDROID_RELEASE_STORE_PASSWORD:-}" && -n "${ANDROID_RELEASE_KEY_ALIAS:-}" && -n "${ANDROID_RELEASE_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > Android/release-keystore.jks
            {
              echo "storeFile=release-keystore.jks"
              echo "storePassword=${ANDROID_RELEASE_STORE_PASSWORD}"
              echo "keyAlias=${ANDROID_RELEASE_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_RELEASE_KEY_PASSWORD}"
            } > Android/signing.properties
            echo "[info] Android release signing configured from GitHub secrets."
          else
            if [[ ! -f Android/release-keystore.jks || ! -f Android/signing.properties ]]; then
              echo "[error] Android release signing files are missing from the project."
              echo "[hint] Add Android/release-keystore.jks and Android/signing.properties, or configure the Android release signing secrets."
              exit 1
            fi
            echo "[info] Android release signing configured from project keystore files."
          fi

      - name: Build APKs
        working-directory: Android
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Upload Android release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare_release.outputs.release_tag }}
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: Android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS Package (${{ matrix.sdk }})
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    needs: prepare_release
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.benno111.dorfplatformertimetravel' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'development' }}
      IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphonesimulator
            triplet: arm64-ios-simulator
            artifact_suffix: simulator
            build_mode: build
          - sdk: iphoneos
            triplet: arm64-ios
            artifact_suffix: device
            build_mode: ipsw

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Smoke iOS package validators
        run: bash build/ios-package-smoke.sh

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: .ci/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            .ci/vcpkg/downloads
            .ci/vcpkg/buildtrees
            .ci/vcpkg/packages
            .ci/vcpkg/installed
          key: vcpkg-ios-${{ matrix.triplet }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/android-build.yml', 'build/ios.sh', 'build/ios-package-smoke.sh', 'cmake/PackageIosApp.cmake', 'cmake/ValidateIosPackage.cmake', 'cmake/ValidateIosPackageManifest.cmake', 'cmake/NormalizeIosSdk.cmake', 'cmake/IosRequiredBundleEntries.cmake', 'cmake/IosBundledProjectFiles.cmake', 'cmake/LaunchScreen.storyboard', 'cmake/iOSInfo.plist.in', 'cmake/vcpkg-triplets/arm64-ios-device-release.cmake', 'cmake/vcpkg-triplets/*.cmake', 'Android/app/src/main/res/drawable/android_icon_192.png') }}

      - name: Bootstrap vcpkg
        run: ./.ci/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install iOS dependencies
        env:
          PLATFORMER_IOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          ./.ci/vcpkg/vcpkg install \
            sdl3 \
            sdl3-image \
            sdl3-ttf \
            sdl3-mixer \
            curl \
            nlohmann-json \
            --triplet "${{ matrix.triplet }}" \
            --overlay-triplets "${GITHUB_WORKSPACE}/cmake/vcpkg-triplets"

      - name: Prepare iOS signing
        env:
          IOS_MATRIX_SDK: ${{ matrix.sdk }}
          SECRET_IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          SECRET_IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          SECRET_IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          SECRET_IOS_CODE_SIGN_STYLE: ${{ secrets.IOS_CODE_SIGN_STYLE }}
          SECRET_IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
          SECRET_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          SECRET_IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          SECRET_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          decode_base64_secret() {
            local output="$1"
            if base64 --help 2>&1 | grep -q -- '--decode'; then
              base64 --decode > "${output}"
            else
              base64 -D > "${output}"
            fi
          }
          if [[ -n "${SECRET_IOS_BUNDLE_ID:-}" ]]; then
            echo "IOS_BUNDLE_ID=${SECRET_IOS_BUNDLE_ID}" >> "$GITHUB_ENV"
          fi
          if [[ "${IOS_MATRIX_SDK}" == "iphoneos" && -n "${SECRET_IOS_DEVELOPMENT_TEAM:-}" && -n "${SECRET_IOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            if [[ -n "${SECRET_IOS_CERTIFICATE_P12_BASE64:-}" ]]; then
              signing_dir="${RUNNER_TEMP}/ios-signing"
              keychain_path="${signing_dir}/build.keychain-db"
              keychain_password="$(uuidgen)"
              mkdir -p "${signing_dir}"
              printf '%s' "${SECRET_IOS_CERTIFICATE_P12_BASE64}" | decode_base64_secret "${signing_dir}/certificate.p12"
              security create-keychain -p "${keychain_password}" "${keychain_path}"
              security set-keychain-settings -lut 21600 "${keychain_path}"
              security unlock-keychain -p "${keychain_password}" "${keychain_path}"
              security import "${signing_dir}/certificate.p12" \
                -P "${SECRET_IOS_CERTIFICATE_PASSWORD:-}" \
                -A \
                -t cert \
                -f pkcs12 \
                -k "${keychain_path}"
              security list-keychains -d user -s "${keychain_path}" login.keychain-db
              security default-keychain -d user -s "${keychain_path}"
              security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
              echo "[info] Imported iOS signing certificate into a temporary keychain."
            fi
            if [[ -n "${SECRET_IOS_PROVISIONING_PROFILE_BASE64:-}" ]]; then
              profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
              signing_dir="${RUNNER_TEMP}/ios-signing"
              mkdir -p "${profile_dir}"
              mkdir -p "${signing_dir}"
              profile_tmp="${signing_dir}/platformer.mobileprovision"
              profile_plist="${signing_dir}/platformer-profile.plist"
              printf '%s' "${SECRET_IOS_PROVISIONING_PROFILE_BASE64}" | decode_base64_secret "${profile_tmp}"
              profile_uuid=""
              if security cms -D -i "${profile_tmp}" > "${profile_plist}" 2>/dev/null; then
                profile_uuid="$((/usr/libexec/PlistBuddy -c 'Print UUID' "${profile_plist}" 2>/dev/null) || true)"
              fi
              if [[ -n "${profile_uuid}" ]]; then
                cp "${profile_tmp}" "${profile_dir}/${profile_uuid}.mobileprovision"
              else
                cp "${profile_tmp}" "${profile_dir}/platformer.mobileprovision"
              fi
              echo "[info] Installed iOS provisioning profile for this job."
            fi
            echo "IOS_CODE_SIGNING_ALLOWED=YES" >> "$GITHUB_ENV"
            echo "IOS_CODE_SIGNING_REQUIRED=YES" >> "$GITHUB_ENV"
            echo "IOS_DEVELOPMENT_TEAM=${SECRET_IOS_DEVELOPMENT_TEAM}" >> "$GITHUB_ENV"
            if [[ -n "${SECRET_IOS_CODE_SIGN_IDENTITY:-}" ]]; then
              echo "IOS_CODE_SIGN_IDENTITY=${SECRET_IOS_CODE_SIGN_IDENTITY}" >> "$GITHUB_ENV"
            fi
            if [[ -n "${SECRET_IOS_CODE_SIGN_STYLE:-}" ]]; then
              echo "IOS_CODE_SIGN_STYLE=${SECRET_IOS_CODE_SIGN_STYLE}" >> "$GITHUB_ENV"
            else
              echo "IOS_CODE_SIGN_STYLE=Automatic" >> "$GITHUB_ENV"
            fi
            if [[ -n "${SECRET_IOS_PROVISIONING_PROFILE_SPECIFIER:-}" ]]; then
              echo "IOS_PROVISIONING_PROFILE_SPECIFIER=${SECRET_IOS_PROVISIONING_PROFILE_SPECIFIER}" >> "$GITHUB_ENV"
            fi
            echo "[info] iOS device signing enabled from GitHub secrets."
          else
            echo "IOS_CODE_SIGNING_ALLOWED=NO" >> "$GITHUB_ENV"
            echo "IOS_CODE_SIGNING_REQUIRED=NO" >> "$GITHUB_ENV"
            if [[ "${IOS_MATRIX_SDK}" == "iphoneos" && -n "${SECRET_IOS_DEVELOPMENT_TEAM:-}" && -z "${SECRET_IOS_CERTIFICATE_P12_BASE64:-}" ]]; then
              echo "[info] iOS signing disabled because IOS_CERTIFICATE_P12_BASE64 is not configured."
            else
              echo "[info] iOS signing disabled for this matrix entry."
            fi
          fi

      - name: Check iOS build environment
        env:
          IOS_SDK: ${{ matrix.sdk }}
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
          VCPKG_TOOLCHAIN_FILE: ${{ github.workspace }}/.ci/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_OVERLAY_TRIPLETS_DIR: ${{ github.workspace }}/cmake/vcpkg-triplets
          VCPKG_INSTALL_DEPS: "OFF"
          IOS_REQUIRE_SDL3_MIXER: "ON"
          IOS_REQUIRE_CURL: "ON"
          PLATFORMER_IOS_DEPLOYMENT_TARGET: "15.0"
          IOS_PACKAGE_DIR: ${{ github.workspace }}/dist/ios-${{ matrix.artifact_suffix }}
        run: ./build/ios.sh doctor

      - name: Build iOS package artifacts
        env:
          IOS_SDK: ${{ matrix.sdk }}
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
          VCPKG_TOOLCHAIN_FILE: ${{ github.workspace }}/.ci/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_OVERLAY_TRIPLETS_DIR: ${{ github.workspace }}/cmake/vcpkg-triplets
          VCPKG_INSTALL_DEPS: "OFF"
          IOS_REQUIRE_SDL3_MIXER: "ON"
          IOS_REQUIRE_CURL: "ON"
          PLATFORMER_IOS_DEPLOYMENT_TARGET: "15.0"
          IOS_PACKAGE_DIR: ${{ github.workspace }}/dist/ios-${{ matrix.artifact_suffix }}
        run: ./build/ios.sh "${{ matrix.build_mode }}"

      - name: Validate iOS package artifacts
        env:
          IOS_SDK: ${{ matrix.sdk }}
          IOS_PACKAGE_DIR: ${{ github.workspace }}/dist/ios-${{ matrix.artifact_suffix }}
          IOS_SOURCE_ASSETS_DIR: ${{ github.workspace }}/assets
          IOS_SOURCE_ROOT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ./build/ios.sh verify

      - name: Audit iOS artifact manifest
        env:
          IOS_SDK: ${{ matrix.sdk }}
          IOS_ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          IOS_PACKAGE_DIR: ${{ github.workspace }}/dist/ios-${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          package_dir = Path(os.environ["IOS_PACKAGE_DIR"])
          manifest_path = package_dir / "platformer-ios-package-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          expected_sdk = os.environ["IOS_SDK"]
          if manifest.get("sdk") != expected_sdk:
              raise SystemExit(f"manifest sdk {manifest.get('sdk')!r} != {expected_sdk!r}")
          expected_device_artifact = expected_sdk == "iphoneos"
          if manifest.get("device_artifact") is not expected_device_artifact:
              raise SystemExit(
                  f"manifest device_artifact {manifest.get('device_artifact')!r} "
                  f"!= {expected_device_artifact!r}"
              )
          if manifest.get("ipsw_format") != "app_archive_compatibility_copy":
              raise SystemExit("manifest ipsw_format is not the requested compatibility artifact marker")
          for key in ("bundle_identifier", "bundle_short_version", "bundle_version", "minimum_os_version"):
              if not isinstance(manifest.get(key), str) or not manifest[key]:
                  raise SystemExit(f"manifest {key} is missing or invalid: {manifest.get(key)!r}")
          for key in ("validated_required_bundle_entries", "validated_source_assets", "validated_project_files"):
              if not isinstance(manifest.get(key), int) or manifest[key] <= 0:
                  raise SystemExit(f"manifest {key} is missing or invalid: {manifest.get(key)!r}")
          required_entries_text = Path("cmake/IosRequiredBundleEntries.cmake").read_text(encoding="utf-8")
          expected_required_entries = required_entries_text.count('"') // 2
          if manifest["validated_required_bundle_entries"] != expected_required_entries:
              raise SystemExit(
                  "manifest required bundle entry count "
                  f"{manifest['validated_required_bundle_entries']} != {expected_required_entries}"
              )

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          package_hashes = {}
          for key in ("ipa", "ipsw"):
              info = manifest[key]
              package = package_dir / info["file"]
              if not package.is_file() or package.stat().st_size <= 0:
                  raise SystemExit(f"{key} package is missing or empty: {package}")
              if package.stat().st_size != info["size_bytes"]:
                  raise SystemExit(f"{key} size mismatch")
              actual_sha = sha256(package)
              if actual_sha != info["sha256"]:
                  raise SystemExit(f"{key} sha256 mismatch")
              package_hashes[key] = actual_sha
          if package_hashes["ipa"] != package_hashes["ipsw"]:
              raise SystemExit("ipa and ipsw hashes differ")
          checksum_path = package_dir / manifest["checksum_file"]
          checksum_text = checksum_path.read_text(encoding="utf-8")
          for key in ("ipa", "ipsw"):
              expected_line = f"{package_hashes[key]}  platformer.{key}"
              if expected_line not in checksum_text:
                  raise SystemExit(f"checksum file missing {key} hash")

          print(
              "iOS artifact audit:",
              os.environ["IOS_ARTIFACT_SUFFIX"],
              manifest["sdk"],
              manifest["archs"],
              f"device={manifest['device_artifact']}",
              f"bundle={manifest['bundle_identifier']}",
              f"version={manifest['bundle_short_version']}",
              f"assets={manifest['validated_source_assets']}",
              f"ipa_bytes={manifest['ipa']['size_bytes']}",
          )
          PY

      - name: Upload iOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: platformer-ios-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ios-${{ matrix.artifact_suffix }}/platformer.ipa
            dist/ios-${{ matrix.artifact_suffix }}/platformer.ipsw
            dist/ios-${{ matrix.artifact_suffix }}/platformer-ios-package-manifest.json
            dist/ios-${{ matrix.artifact_suffix }}/platformer-ios-package-sha256.txt

      - name: Stage iOS release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        env:
          IOS_ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "dist/ios-${{ matrix.artifact_suffix }}/platformer.ipa" "release/platformer-ios-${{ matrix.artifact_suffix }}.ipa"
          cp "dist/ios-${{ matrix.artifact_suffix }}/platformer.ipsw" "release/platformer-ios-${{ matrix.artifact_suffix }}.ipsw"
          cp "dist/ios-${{ matrix.artifact_suffix }}/platformer-ios-package-manifest.json" "release/platformer-ios-${{ matrix.artifact_suffix }}-manifest.json"
          test -s "release/platformer-ios-${{ matrix.artifact_suffix }}.ipa"
          test -s "release/platformer-ios-${{ matrix.artifact_suffix }}.ipsw"
          test -s "release/platformer-ios-${{ matrix.artifact_suffix }}-manifest.json"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          suffix = os.environ["IOS_ARTIFACT_SUFFIX"]
          release_dir = Path("release")
          checksum_path = release_dir / f"platformer-ios-{suffix}-sha256.txt"
          lines = []
          for extension in ("ipa", "ipsw"):
              name = f"platformer-ios-{suffix}.{extension}"
              path = release_dir / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
          checksum_path.write_text("".join(lines), encoding="utf-8")
          PY
          test -s "release/platformer-ios-${{ matrix.artifact_suffix }}-sha256.txt"
          grep -q "platformer-ios-${{ matrix.artifact_suffix }}.ipa" "release/platformer-ios-${{ matrix.artifact_suffix }}-sha256.txt"
          grep -q "platformer-ios-${{ matrix.artifact_suffix }}.ipsw" "release/platformer-ios-${{ matrix.artifact_suffix }}-sha256.txt"

      - name: Upload iOS release assets
        if: needs.prepare_release.outputs.release_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare_release.outputs.release_tag }}
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/platformer-ios-${{ matrix.artifact_suffix }}.ipa
            release/platformer-ios-${{ matrix.artifact_suffix }}.ipsw
            release/platformer-ios-${{ matrix.artifact_suffix }}-manifest.json
            release/platformer-ios-${{ matrix.artifact_suffix }}-sha256.txt

      - name: Clean up iOS signing assets
        if: ${{ always() && steps.ios-signing.outputs.signing_enabled == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
